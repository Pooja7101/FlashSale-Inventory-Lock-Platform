
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashSale Customer Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            color: #263445;
        }

        header {
            background: #205b78;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            text-align: center;
        }

        .menu a {
            display: inline-block;
            background: #205b78;
            color: white;
            padding: 13px 22px;
            margin: 10px;
            text-decoration: none;
            border-radius: 6px;
        }

        .menu a:hover {
            background: #123d53;
        }
    </style>
</head>

<body>

<header>
    <h1>FlashSale</h1>
    <p>Multi-Vendor Flash Sale Platform</p>
</header>

<div class="container">
    <h2>Welcome to FlashSale!</h2>

    <p>
        Discover products, reserve your favourite items
        and confirm your orders.
    </p>

    <div class="menu">
        <a href="products">Browse Products</a>
        <a href="orders">Order History</a>
        <a href="logout">Logout</a>
    </div>
</div>

</body>
</html>
